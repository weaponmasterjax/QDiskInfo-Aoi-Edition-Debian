name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    permissions:
      actions: read
      security-events: write
      contents: write
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - arch: aarch64
            deb_arch: arm64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
          - arch: x86_64
            deb_arch: amd64
            platform: linux/amd64
            runs-on: ubuntu-24.04
    container:
      image: debian:trixie

    steps:
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            unzip \
            git \
            build-essential \
            cmake \
            clang \
            dpkg-dev \
            libxkbcommon-dev \
            libgl-dev \
            libvulkan-dev \
            patchelf \
            qt6-base-dev \
            qt6-svg-dev \
            qt6-svg-plugins \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-wayland \
            qt6ct \
            libqt6svg6 \
            kde-style-breeze \
            breeze-icon-theme \
            smartmontools \
            binutils \
            file \
            strace \
            wget

      - uses: actions/checkout@v4

      - name: Download and unpack Aoi themes
        run: |
          chmod +x ./scripts/fetch-aoi-themes.sh
          ./scripts/fetch-aoi-themes.sh

      - name: Build
        run: |
          cmake -Bbuild -DCMAKE_BUILD_TYPE:STRING=MinSizeRel -DCMAKE_INSTALL_PREFIX=/usr -DQT_VERSION_MAJOR=6 -DENABLE_TRANSLATIONS=ON -DINCLUDE_OPTIONAL_RESOURCES=ON -DCHARACTER_IS_RIGHT=ON
          cmake --build build --parallel

      - name: Package DEB
        run: |
          BASE_VERSION="$(sed -nE 's/^project\([^)]*VERSION[[:space:]]+([0-9][0-9A-Za-z.+~]*).*/\1/p' CMakeLists.txt | head -n 1)"
          BASE_VERSION="${BASE_VERSION:-0.4}"
          SHORT_SHA="$(git rev-parse --short=9 HEAD)"
          DEB_VERSION="${BASE_VERSION}+git${SHORT_SHA}"
          chmod +x ./scripts/build-deb.sh
          ./scripts/build-deb.sh \
            --build-dir ./build \
            --output-dir ./deb-out \
            --version "$DEB_VERSION" \
            --release "1+deb13" \
            --skip-build \
            --require-themes

      - name: Package AppImage
        run: |
          chmod +x ./qdiskinfo-appimage.sh
          ./qdiskinfo-appimage.sh

      - name: Verify DEB install
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y ./deb-out/qdiskinfo-aoi_*.deb
          test -x /usr/bin/QDiskInfo
          ! ldd /usr/bin/QDiskInfo | grep -q "not found"
          dpkg-deb --field ./deb-out/qdiskinfo-aoi_*.deb Depends | grep -q "libqt6widgets6"
          test -f /usr/share/QDiskInfo/themes/Aoi/AoiBackground-300.png
          test -f /usr/share/QDiskInfo/themes/Aoi/SDdiskStatusGood100-300.png
          test -f /usr/share/applications/QDiskInfo.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/QDiskInfo.svg
          test -f /usr/share/icons/hicolor/256x256/apps/QDiskInfo.png
          test -f /usr/share/doc/qdiskinfo-aoi/copyright

      - name: List Files
        run: ls -la ./deb-out

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: QDiskInfo-${{ matrix.deb_arch }}-deb
          path: ./deb-out/*.deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: QDiskInfo-${{ matrix.arch }}-AppImage
          path: ./QDiskInfo*.AppImage*

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: QDiskInfo-Qt6-${{ matrix.arch }}-bin
          path: |
            ./build/QDiskInfo
            ./themes
