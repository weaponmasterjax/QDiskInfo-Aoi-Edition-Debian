name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    permissions:
      actions: read
      security-events: write
      contents: write
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
          - arch: x86_64
            platform: linux/amd64
            runs-on: ubuntu-24.04
    container:
      image: debian:trixie

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            build-essential \
            cmake \
            clang \
            libxkbcommon-dev \
            libgl-dev \
            libvulkan-dev \
            patchelf \
            qt6-base-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-wayland \
            qt6ct \
            libqt6svg6 \
            kde-style-breeze \
            breeze-icon-theme \
            smartmontools \
            binutils \
            file \
            strace \
            wget

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -Bbuild -DCMAKE_BUILD_TYPE:STRING=MinSizeRel -DQT_VERSION_MAJOR=6 -DENABLE_TRANSLATIONS=ON -DINCLUDE_OPTIONAL_RESOURCES=ON -DCHARACTER_IS_RIGHT=ON
          cmake --build build

      - name: Package AppImage
        run: |
          chmod +x ./qdiskinfo-appimage.sh
          ./qdiskinfo-appimage.sh

      - name: List Files
        run: ls -la

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: QDiskInfo-${{ matrix.arch }}-AppImage
          path: ./QDiskInfo*.AppImage*

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: QDiskInfo-Qt6-${{ matrix.arch }}-bin
          path: ./build/QDiskInfo
